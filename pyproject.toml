[project]
name = "paper-falsifier"
version = "0.1.1"
description = "Scoped, reviewable applicability tests for numerical ML papers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["wasmtime==50.0.1"]

[project.scripts]
paper-falsifier = "paper_falsifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_falsifier"]
